name: Quality & Security CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  inspect:
    name: Code Quality & Security Inspection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: none

      - name: Run AutomaEyes Quality & Security Inspector
        run: node app/scripts/check.js
